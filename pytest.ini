[pytest]
# Configuration pytest pour le projet Hello-World-

# Répertoires de test
testpaths = tests

# Pattern de découverte des tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Options de sortie
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Marqueurs personnalisés (optionnel)
markers =
    unit: Tests unitaires
    integration: Tests d'intégration
    slow: Tests lents
